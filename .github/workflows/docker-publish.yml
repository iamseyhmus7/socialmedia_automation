name: CI/CD Pipeline

on:
  push:
    branches: ["master" ]
  pull_request:
    branches: ["master" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest tests/

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Bot Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sosyal_medya_icerik_uretimi-bot:ci
          build-args: |
            APP_COMMAND=python -m src.app.bot

      - name: Build Tiktok-Due Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sosyal_medya_icerik_uretimi-tiktok-due:ci
          build-args: |
            APP_COMMAND=python tools/run_due_tiktok_loop.py

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: docker-build # Testler ve Docker build doğrulaması geçmeden bu adım başlamaz!
    if: github.event_name == 'push' # Sadece push yapıldığında (pull request değilse) imajı oluştur ve yolla

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Bot Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sosyal_medya_icerik_uretimi-bot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sosyal_medya_icerik_uretimi-bot:${{ github.sha }}
          build-args: |
            APP_COMMAND=python -m src.app.bot

      - name: Build and Push Tiktok-Due Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sosyal_medya_icerik_uretimi-tiktok-due:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sosyal_medya_icerik_uretimi-tiktok-due:${{ github.sha }}
          build-args: |
            APP_COMMAND=python tools/run_due_tiktok_loop.py
