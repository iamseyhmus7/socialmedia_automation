services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_history}
      POSTGRES_USER: ${POSTGRES_USER:-video_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video_history_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-video_app} -d ${POSTGRES_DB:-video_history}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    command: python -m src.app.bot
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-video_app}:${POSTGRES_PASSWORD:-video_history_password}@postgres:5432/${POSTGRES_DB:-video_history}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  tiktok-due:
    build: .
    command: python tools/run_due_tiktok_loop.py
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      TIKTOK_DUE_CHECK_INTERVAL_SECONDS: "300"
      DATABASE_URL: postgresql://${POSTGRES_USER:-video_app}:${POSTGRES_PASSWORD:-video_history_password}@postgres:5432/${POSTGRES_DB:-video_history}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
